name: Run Train Delay Flat-File Scraper

on:
  schedule:
    # Runs daily at 11:30 PM UTC (5:00 AM IST)
    - cron: '30 23 * * *'
  workflow_dispatch: 

permissions:
  contents: write 

jobs:
  scrape:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    # Runs your updated script, which creates or appends to train_delays.csv
    - name: Run Scraper Script
      run: |
        python scraper.py

    # Automatically saves the updated CSV file back into your GitHub repository
    - name: Commit and Push Changes
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
        git add train_delays.csv
        git diff-index --quiet HEAD || (git commit -m "Automated daily data update: $(date +'%Y-%m-%d')" && git push)
